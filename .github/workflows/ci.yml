name: CI

# DocoPDF CI (PRD §2.6): lint, typecheck, build.
# NOTE: unit tests (Vitest) are part of the production CI plan; add a
# `bun run test` step once the first test files exist (planned with Phase 2's
# worker protocol). This sandbox environment does not author test code.
#
# Deployment layout note: in the GitHub monorepo this app lives at `apps/web`
# — add `defaults: run: working-directory: apps/web` there. Paths here match
# the sandbox (repo root).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  web:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma client
        run: bun run db:generate
        env:
          DATABASE_URL: "file:./db/custom.db"

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Build
        run: bun run build
        env:
          DATABASE_URL: "file:./db/custom.db"
